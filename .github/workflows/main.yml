name: CineAndes IaC Pipeline

run-name: ${{ github.actor }} está ejecutando el pipeline de CineAndes
on: [push]

jobs:
  CineAndes-Pipeline:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Pipeline activado por un ${{ github.event_name }}"
      - run: echo "Rama ${{ github.ref }} del repositorio ${{ github.repository }}"

      - name: Descargar el repositorio
        run: echo "Simulación: Descargando el repositorio..."

      - name: Listar los archivos del repositorio
        run: echo "Simulación: Listando los archivos del repositorio..."

      - name: Validación
        run: |
          echo "Revisar el formato del código de Terraform"
          echo "Inicializar Terraform y descargar el proveedor de AWS"
          echo "Validar la configuración de los módulos de red y cómputo"

      - name: Planificación
        run: |
          echo "Generar el plan de cambios en AWS con terraform plan"

      - name: Despliegue de infraestructura
        run: |
          echo "Crear la red (VPC, subredes, NAT y tablas de rutas)"
          echo "Crear el cómputo (grupo de seguridad, roles de IAM y Lambdas)"

      - name: Despliegue de las funciones
        run: |
          echo "Empaquetar el código de las 7 Lambdas con Ansible"
          echo "Desplegar el código de las Lambdas con Ansible"

      - name: Verificación
        run: |
          echo "Verificar con Ansible que las Lambdas respondan"

      - name: Limpieza del entorno de desarrollo
        run: |
          echo "Destruir el entorno de desarrollo con terraform destroy"
